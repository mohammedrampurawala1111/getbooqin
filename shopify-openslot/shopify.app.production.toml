# Production config — used for the App Store submission and every real
# deploy. Unlike shopify.app.toml (the dev config, whose application_url the
# CLI keeps overwriting with a fresh tunnel URL on every `npm run dev`), this
# file pins application_url to the permanent fly.dev host so it can never
# drift. Select it with `shopify app config use production` (or
# `npm run config:use production`) before running `npm run deploy`.
client_id = "80f15f805851ecca97d8b6342a6d9d87"
name = "GetBooqin"
handle = "getbooqin"
application_url = "https://getbooqin.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  # Auto-creates a bookable service for any product typed "Service" — see
  # webhooks.products.tsx.
  topics = [ "products/create", "products/update" ]
  uri = "/webhooks/products"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://getbooqin.fly.dev/webhooks/customers/redact"
  customer_data_request_url = "https://getbooqin.fly.dev/webhooks/customers/data_request"
  shop_deletion_url = "https://getbooqin.fly.dev/webhooks/shop/redact"

[access_scopes]
# Prompt 3 catalog refactor: write_products was added alongside read_products
# so GetBooqin can write ServiceConfig booking settings to the product's
# `getbooqin` metafields — see shopify.app.toml's matching comment for
# details. This scope change means already-installed merchants see a
# re-consent screen on next login.
scopes = "read_products,write_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://getbooqin.fly.dev/auth/callback",
  "https://getbooqin.fly.dev/auth/shopify/callback",
  "https://getbooqin.fly.dev/api/auth/callback",
  "https://getbooqin.fly.dev/connect/shopify/callback"
]

[app_proxy]
url = "https://getbooqin.fly.dev/apps/getbooqin"
subpath = "getbooqin"
prefix = "apps"

[pos]
embedded = false
